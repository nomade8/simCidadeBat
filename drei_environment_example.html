<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drei Environment Example</title>
  <style>body{margin:0;height:100vh;overflow:hidden}#root{width:100%;height:100%}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18.2.0'
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client'
    import { Canvas } from 'https://esm.sh/@react-three/fiber@8.12.9'
    import { Environment, OrbitControls } from 'https://esm.sh/@react-three/drei@9.59.4'

    const { createElement } = React

    function Scene() {
      return createElement(Canvas, { camera: { position: [0, 1, 3], fov: 50 }, style: { width: '100%', height: '100%' } },
        createElement(React.Suspense, { fallback: null },
          createElement(Environment, { files: './citrus_orchard_puresky_4k.exr', background: true })
        ),
        createElement('ambientLight', { intensity: 0.3 }),
        createElement('directionalLight', { position: [5, 5, 5], intensity: 1 }),
        createElement('mesh', null,
          createElement('sphereGeometry', { args: [1, 64, 64] }),
          createElement('meshStandardMaterial', { metalness: 1, roughness: 0 })
        ),
        createElement(OrbitControls, null)
      )
    }

    const root = createRoot(document.getElementById('root'))
    root.render(createElement(Scene))
  </script>
</body>
</html>
